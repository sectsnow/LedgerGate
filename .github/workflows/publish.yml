name: 发布 GHCR 镜像

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 源码测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: 检查并构建前端
        working-directory: web
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm test
          corepack pnpm build
      - name: 设置 Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: 测试后端
        run: go test ./...

  publish:
    name: 构建、验收并上传镜像
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      LEDGERGATE_IMAGE: ledgergate:ci
      LEDGERGATE_PORT: "18080"
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 确定镜像地址
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: 生成镜像标签
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: 构建待验收镜像
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ledgergate:ci
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 验证首次设置与重建后数据保留
        run: |
          docker compose -p ledgergate-ci up -d --no-build --wait --wait-timeout 90
          python3 - <<'PY'
          import http.cookiejar
          import json
          import re
          import secrets
          import subprocess
          from urllib.request import HTTPCookieProcessor, ProxyHandler, Request, build_opener

          client = build_opener(ProxyHandler({}), HTTPCookieProcessor(http.cookiejar.CookieJar()))

          def request(path, body=None):
              payload = None if body is None else json.dumps(body).encode()
              headers = {"Content-Type": "application/json", "X-LedgerGate-Request": "1"}
              with client.open(Request("http://127.0.0.1:18080" + path, data=payload, headers=headers), timeout=5) as response:
                  assert response.status == 200, path
                  return response.read()

          assert json.loads(request("/api/setup"))["setup_required"] is True
          assets = re.findall(r'(?:src|href)="(/assets/[^"]+)"', request("/").decode())
          assert assets, "缺少前端构建产物"
          for asset in assets:
              assert request(asset), asset
          password = secrets.token_urlsafe(24)
          assert json.loads(request("/api/setup", {"password": password, "confirm_password": password}))["ok"] is True
          subprocess.run(["docker", "compose", "-p", "ledgergate-ci", "up", "-d", "--no-build", "--force-recreate", "--wait", "--wait-timeout", "90"], check=True)
          assert json.loads(request("/api/setup"))["setup_required"] is False
          assert json.loads(request("/api/login", {"password": password}))["ok"] is True
          assert json.loads(request("/api/session"))["authenticated"] is True
          PY
      - name: 输出容器日志并清理验收数据
        if: always()
        run: |
          docker compose -p ledgergate-ci logs --no-color
          docker compose -p ledgergate-ci down --volumes
      - name: 登录 GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 上传已通过验收的镜像
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
